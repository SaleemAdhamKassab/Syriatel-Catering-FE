<div align="center" *ngIf="!Done" style="margin-top:20%;">
    <mat-spinner diameter="100" color="primary"></mat-spinner>
</div>
<span *ngIf="Done" style="width:100%;display: flex;height: 100%;">
    <div style="width: 70%;height: 100%;overflow-y: auto;">

        <mat-tab-group class="tab" color="primary">
            <span *ngFor="let cat of Products">
                <mat-tab label="{{cat.Name}}" *ngIf="group.value=='true'?cat.Enable:!cat.Enable">
                    <mat-list role="list">
                        <mat-list-item role="listitem" *ngFor="let i of cat.Products">
                            <mat-card class="item">

                                <mat-form-field appearance="standard" class="price-input">
                                    <input matInput [(ngModel)]="i.Name" (change)="onChangeInput(i)">
                                </mat-form-field>

                                <mat-slide-toggle class="Enable" [checked]="i.Enable" (change)="click(i)">Active
                                </mat-slide-toggle>

                                <mat-form-field appearance="standard" class="price-input">
                                    <mat-label>الكمية</mat-label>
                                    <input matInput [(ngModel)]="i.AvailableProduact" (change)="onChangeInput(i)"
                                        type="number" min="0">
                                </mat-form-field>

                                <mat-form-field appearance="standard" class="price-input">
                                    <mat-label>السعر</mat-label>
                                    <input matInput [(ngModel)]="i.InitialPrice" (change)="onChangeInput(i)"
                                        type="number" min="0">
                                </mat-form-field>

                                <button mat-mini-fab matSuffix class="save" (click)="saveInput(i)" *ngIf="i.show"> ✔️
                                </button>


                            </mat-card>
                        </mat-list-item>
                    </mat-list>
                </mat-tab>
            </span>
        </mat-tab-group>
    </div>
    <div style="width: 30%;margin: 3%;">
     <mat-card style="height: 100%;">
        <mat-button-toggle-group  #group="matButtonToggleGroup"
        value="true"  color="primary" >
        <mat-button-toggle value="true"> المفعلة</mat-button-toggle>
        <mat-button-toggle value="false"> غير المفعلة</mat-button-toggle>
    </mat-button-toggle-group>
    <mat-slide-toggle class="Enable" [(ngModel)]="isChecked" (change)="changeStatus()">Active</mat-slide-toggle>

    <mat-card style="margin-top:100px;border: 2px solid #eee;" *ngIf="news">
    <mat-grid-list cols=1 rowHeight=50px *ngFor="let x of news" style="margin-top: 5px;"> 
        <mat-grid-tile class="news" >
            <mat-form-field appearance="standard" style="width: 100%;font-weight: bold;float: right;">
                <input #input matInput [(ngModel)]="x.Title" (change)="x.show=true" style="float: right;">
            </mat-form-field>
            <button mat-button matSuffix *ngIf="x.show" (click)="updateTitle(x)" > ✔️
            </button>
        </mat-grid-tile>
    </mat-grid-list>
    </mat-card>
    <button mat-fab class="add" [matMenuTriggerFor]="menu" color="primary">✣</button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="newCategory()">Categories</button>
        <button mat-menu-item (click)="newProduct()">Products</button>
        <button mat-menu-item (click)="newExtra()">Extras</button>
    </mat-menu>
     </mat-card>
</div>
</span>
