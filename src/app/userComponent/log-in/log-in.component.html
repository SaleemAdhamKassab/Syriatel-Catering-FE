<mat-toolbar color="primary" style="height:60px;font-family: muli;"> Syriatel Cafeteria
</mat-toolbar>

<div class="main-img">
    <img src="assets/main.jpg" width="100%" height="100%" class="photo">
</div>

<mat-grid-list cols=3 rowHeight=3:3 *ngIf="Done">
    <mat-grid-tile></mat-grid-tile>
    <mat-grid-tile>
        <div class="login-wrapper" fxLayout="row" fxLayoutAlign="center center">
            <mat-card class="box">
                <span class="mat-title">Welcome {{user}}</span>

                <form class="example-form" [formGroup]="myInfo">
                    <mat-card-content>
                        <mat-form-field class="example-full-width" appearance="outline">
                            <input matInput placeholder="Arabic Name" formControlName="Note">
                            <mat-error > Arabic Name is required </mat-error>

                        </mat-form-field>
                        <mat-form-field class="example-full-width" appearance="outline">
                            <input matInput placeholder="Phone" formControlName="Phone">
                            <mat-error > must be 10 digits start with '09' </mat-error>
                        </mat-form-field>
                        <mat-form-field class="example-full-width" appearance="outline">
                            <mat-label>Choose a Building...</mat-label>
                            <mat-select formControlName="Location">
                                <mat-option [value]="building" *ngFor="let building of buildings">{{building}}
                                </mat-option>
                            </mat-select>
                            <mat-error >the building is required </mat-error>
                        </mat-form-field>
                        <mat-form-field class="example-full-width" appearance="outline">
                            <mat-label>Choose a Floor...</mat-label>
                            <mat-select formControlName="Floor">
                                <mat-option [value]="Floor" *ngFor="let Floor of Floors |slice :0: getBuilding()">
                                    {{Floor}}
                                </mat-option>
                            </mat-select>
                            <mat-error >the floor is required </mat-error>
                        </mat-form-field>
                    </mat-card-content>
                    <button mat-stroked-button color="accent" class="btn-block" [disabled]="myInfo.invalid"
                        (click)="registerInfo()">Register</button>
                </form>
            </mat-card>
        </div>
    </mat-grid-tile>
    <mat-grid-tile></mat-grid-tile>

</mat-grid-list>
